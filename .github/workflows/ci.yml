name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck install.sh
      - name: compile
        run: python -m py_compile agent/*.py tests/*.py
      - name: hook tests
        run: python -m unittest discover -s tests -v
      - name: no personal data or secrets
        run: |
          ! grep -rInE '(TELEGRAM_API_HASH|TELEGRAM_SESSION_STRING)=[0-9a-zA-Z]{8,}' --exclude-dir=.git .
